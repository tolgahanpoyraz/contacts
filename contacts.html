<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contacts App</title>

    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script src="js/contacts.js"></script>

    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg:      #064789;
            --surface: #ffffff;
            --accent:  #FF7D00;
            --text:    #EBF2FA;
            --muted:   #FFECD1;
            --btn:     #2C2A4A;
            --border:  #8babf1;
            --font:    'Georgia', serif;
            --surface-alpha: rgba(255, 255, 255, 0.07);
            --surface-alpha-hover: rgba(255, 255, 255, 0.12);
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Nav ── */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.5rem 3rem;
            border-bottom: 1px solid var(--border);
            animation: fadeDown 0.5s ease both;
        }
        .logo { font-size: 1.25rem; letter-spacing: 0.05em; }
        #userName { font-size: 0.85rem; color: var(--muted); letter-spacing: 0.03em; }
        #loggedInDiv { display: flex; align-items: center; gap: 1rem; }

        /* ── Buttons ── */
        .buttons {
            font-family: var(--font);
            font-size: 0.9rem;
            cursor: pointer;
            padding: 0.5rem 1.25rem;
            border-radius: 6px;
            transition: opacity 0.2s, border-color 0.2s;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text);
            text-decoration: none;
            display: inline-block;
        }
        .buttons:hover { border-color: var(--accent); opacity: 0.9; }
        .buttons.primary { background: var(--btn); color: #fff; border-color: var(--border); }
        .buttons.primary:hover { opacity: 0.85; border-color: var(--accent); }

        /* ── App shell ── */
        .app-shell {
            max-width: 860px;
            margin: 0 auto;
            padding: 3rem 2rem 5rem;
            width: 100%;
        }

        #title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            line-height: 1.1;
            margin-bottom: 0.5rem;
            animation: fadeDown 0.5s 0.05s ease both;
        }
        #title span { color: var(--accent); }

        .page-subtitle {
            color: var(--muted);
            font-size: 1rem;
            margin-bottom: 2.5rem;
            line-height: 1.6;
            animation: fadeDown 0.5s 0.1s ease both;
        }

        /* ── Search ── */
        #searchDiv {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 2rem;
            animation: fadeUp 0.5s 0.15s ease both;
        }
        #searchText {
            flex: 1;
            font-family: var(--font);
            font-size: 0.95rem;
            padding: 0.65rem 1rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: var(--surface-alpha);
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, background 0.2s;
        }
        #searchText::placeholder { color: rgba(235, 242, 250, 0.45); }
        #searchText:focus { border-color: var(--accent); background: var(--surface-alpha-hover); }

        /* ── Status message ── */
        #contactsResult {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            font-style: italic;
            margin-bottom: 1rem;
            min-height: 1.2em;
        }

        /* ── Contact list ── */
        #contactList { margin-bottom: 0.75rem; animation: fadeUp 0.5s 0.2s ease both; }

        .contact {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.2rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 0.6rem;
            background: var(--surface-alpha);
            transition: background 0.2s, border-color 0.2s;
        }
        .contact:hover { background: var(--surface-alpha-hover); border-color: var(--accent); }
        .contact span { font-size: 0.9rem; color: var(--muted); flex: 1; }
        .contact span:first-child { font-size: 1rem; color: var(--text); font-weight: bold; min-width: 140px; }
        .contact .buttons { padding: 0.35rem 0.9rem; font-size: 0.78rem; flex-shrink: 0; }

        /* ── Pagination ── */
        .pagination {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.3rem;
            list-style: none;
            margin: 0.75rem 0;
        }
        .pagination li a,
        .pagination li span {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 2.1rem;
            height: 2.1rem;
            padding: 0 0.5rem;
            border-radius: 6px;
            border: 1px solid var(--border);
            font-family: var(--font);
            font-size: 0.88rem;
            color: var(--text);
            text-decoration: none;
            cursor: pointer;
            transition: border-color 0.2s, background 0.2s;
            background: var(--surface-alpha);
            user-select: none;
        }
        .pagination li a:hover { border-color: var(--accent); background: var(--surface-alpha-hover); }
        .pagination li a.current {
            background: var(--btn);
            border-color: var(--accent);
            color: #fff;
            cursor: default;
        }
        .pagination li span.disabled {
            opacity: 0.35;
            cursor: default;
            border-color: var(--border);
        }
        .pagination li span.gap {
            border-color: transparent;
            background: transparent;
            cursor: default;
            color: var(--muted);
        }

        /* ── Divider ── */
        .section-divider { border: none; border-top: 1px solid var(--border); margin: 2.5rem 0; }

        /* ── Panel cards ── */
        .contact-panel {
            background: var(--surface-alpha);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 2rem 2.2rem;
            animation: fadeUp 0.5s 0.25s ease both;
        }
        .contact-panel h2 { font-size: 1.5rem; margin-bottom: 0.3rem; color: var(--text); }
        .contact-panel h2 span { color: var(--accent); }
        .panel-subtitle {
            font-size: 0.8rem; color: var(--muted); margin-bottom: 1.5rem;
            padding-bottom: 1rem; border-bottom: 1px solid var(--border); letter-spacing: 0.03em;
        }
        .field-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.9rem; margin-bottom: 0.9rem; }
        .field-row.single { grid-template-columns: 1fr; }
        .field-wrap { display: flex; flex-direction: column; gap: 0.3rem; }
        .field-label { font-size: 0.72rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
        .contact-panel input[type="text"] {
            font-family: var(--font); font-size: 0.92rem; padding: 0.6rem 0.9rem;
            border: 1px solid var(--border); border-radius: 6px;
            background: var(--surface-alpha); color: var(--text);
            outline: none; width: 100%; transition: border-color 0.2s, background 0.2s;
        }
        .contact-panel input[type="text"]::placeholder { color: rgba(235, 242, 250, 0.3); }
        .contact-panel input[type="text"]:focus { border-color: var(--accent); background: var(--surface-alpha-hover); }
        .panel-actions {
            display: flex; gap: 0.75rem; margin-top: 1.5rem;
            padding-top: 1.2rem; border-top: 1px solid var(--border);
        }
        #editContactDiv { margin-bottom: 0; }

        /* ── Animations ── */
        @keyframes fadeDown { from { opacity: 0; transform: translateY(-12px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeUp   { from { opacity: 0; transform: translateY(12px);  } to { opacity: 1; transform: translateY(0); } }

        /* ── Responsive ── */
        @media (max-width: 600px) {
            nav { padding: 1rem 1.25rem; }
            .app-shell { padding: 2rem 1.25rem 4rem; }
            .field-row { grid-template-columns: 1fr; }
            .contact-panel { padding: 1.25rem; }
            .contact { flex-wrap: wrap; }
            .pagination { flex-wrap: wrap; }
        }
    </style>
</head>
<body>

    <nav>
        <span class="logo">Contacts</span>
        <div id="loggedInDiv">
            <span id="userName"></span>
            <button type="button" class="buttons" onclick="doLogout()">Log Out</button>
        </div>
    </nav>

    <div class="app-shell">

        <h1 id="title">Your <span>contacts.</span></h1>
        <p class="page-subtitle">Add, search, and manage everyone that matters.</p>

        <!-- Search -->
        <div id="searchDiv">
            <input type="text" id="searchText" placeholder="Search by name or email…" oninput="onSearchInput()" />
            <button type="button" class="buttons primary" onclick="doSearchContacts()">Search</button>
        </div>

        <!-- Top pagination -->
        <ol class="pagination" id="paginationTop" role="navigation" aria-label="Pagination" style="display:none;"></ol>

        <!-- Contact List -->
        <div id="contactList"></div>
        <span id="contactsResult"></span>

        <!-- Bottom pagination -->
        <ol class="pagination" id="paginationBottom" role="navigation" aria-label="Pagination" style="display:none;"></ol>

        <hr class="section-divider" />

        <!-- Edit Contact -->
        <div id="editContactDiv" style="display:none;">
            <div class="contact-panel">
                <h2>Edit <span>Contact</span></h2>
                <p class="panel-subtitle">Update details below</p>
                <div class="field-row">
                    <div class="field-wrap">
                        <label class="field-label">First Name</label>
                        <input type="text" id="editFirstName" placeholder="First Name" />
                    </div>
                    <div class="field-wrap">
                        <label class="field-label">Last Name</label>
                        <input type="text" id="editLastName" placeholder="Last Name" />
                    </div>
                </div>
                <div class="field-row single">
                    <div class="field-wrap">
                        <label class="field-label">Email</label>
                        <input type="text" id="editEmail" placeholder="Email" />
                    </div>
                </div>
                <div class="field-row single">
                    <div class="field-wrap">
                        <label class="field-label">Phone Number</label>
                        <input type="text" id="editPhone" placeholder="Phone Number" />
                    </div>
                </div>
                <div class="panel-actions">
                    <button type="button" class="buttons primary" onclick="doSaveContact()">Save Changes</button>
                    <button type="button" class="buttons" onclick="cancelEdit()">Cancel</button>
                    <span id="editContactResult" style="font-size:0.85rem; color:var(--muted); font-style:italic;"></span>
                </div>
            </div>
            <hr class="section-divider" />
        </div>

        <!-- Add Contact -->
        <div id="addContactDiv">
            <div class="contact-panel">
                <h2>Add <span>Contact</span></h2>
                <p class="panel-subtitle">New entry</p>
                <div class="field-row">
                    <div class="field-wrap">
                        <label class="field-label">First Name</label>
                        <input type="text" id="contactFirstName" placeholder="First Name" />
                    </div>
                    <div class="field-wrap">
                        <label class="field-label">Last Name</label>
                        <input type="text" id="contactLastName" placeholder="Last Name" />
                    </div>
                </div>
                <div class="field-row single">
                    <div class="field-wrap">
                        <label class="field-label">Email</label>
                        <input type="text" id="contactEmail" placeholder="Email" />
                    </div>
                </div>
                <div class="field-row single">
                    <div class="field-wrap">
                        <label class="field-label">Phone Number</label>
                        <input type="text" id="contactPhone" placeholder="Phone Number" />
                    </div>
                </div>
                <div class="panel-actions">
                    <button type="button" class="buttons primary" onclick="doAddContact()">Add Contact</button>
                    <span id="addContactResult" style="font-size:0.85rem; color:var(--muted); font-style:italic;"></span>
                </div>
            </div>
        </div>

    </div><!-- /app-shell -->

</body>
</html>
