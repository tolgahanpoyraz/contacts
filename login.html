<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login – Contacts App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root{
      --bg:      #8babf1;
      --surface: #1a1a1f;
      --accent:  #FF7D00;
      --text:    #EBF2FA;
      --input:   #2C2A4A;
      --muted:   #FFECD1;
      --error:   red;
      --border:  #2e2e36;
      --btn:     #054fb9;
      --font:    'Georgia', serif;
    }

    body {
      background: 
        linear-gradient(
          145deg,
          #064789 20%,
          #ebf2fa 80%
        );
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    
    .card{
      background: rgba(255, 255, 255, 0.1);
      padding: 2rem;
      border-radius: 12px;
      box-shadow: 0 10px 12px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    .card-title {
      text-align: left;
      font-size: 1.5rem;
      margin-bottom: 0.5rem;
    }
 
    .tabs {
      display: flex;
      gap: 0;
      margin-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
 
    .tab {
      flex: 1;
      padding: 0.6rem 1.25rem;
      cursor: pointer;
      font-family: var(--font);
      font-size: 0.9rem;
      color: var(--muted);
      background: none;
      border: none;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      transition: color 0.2s, border-color 0.2s;
    }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }
 
    .form { display: none; flex-direction: column; gap: 1rem; }
    .form.active { display: flex; }
 
    label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.3rem; }
 
    input {
      width: 100%;
      background: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--input);
      font-family: var(--font);
      font-size: 0.95rem;
      padding: 0.65rem 0.85rem;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: var(--accent); }

    input.error {
      border: 2px solid var(--error);
    }
 
    .btn-submit {
      width: 100%;
      background: var(--btn);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 0.75rem;
      font-family: var(--font);
      font-size: 1rem;
      cursor: pointer;
      margin-top: 0.5rem;
      transition: opacity 0.2s;
    }
    .btn-submit:hover { opacity: 0.85; }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; }
 
    .error-msg {
      text-align: center;
      font-style: italic;
      color: var(--error);
      font-size: 0.85rem;
      margin-bottom: 0.6rem;
      min-height: 1.2em;
    }

  .username-placeholder::placeholder {
      font-style: italic;
  }

  </style>
</head>
<body>

  <div class="card">
    <h1 class="card-title">Welcome back!</h1>
 
    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Login</button>
      <button class="tab"        onclick="switchTab('register')">Register</button>
    </div>
 
    <p class="error-msg" id="error-msg"></p>
 
    <div class="form active" id="form-login">
      <div>
        <label for="loginName">Username<span style="color: red;">*</span></label>
        <input type="text" class="form-control username-placeholder" id="loginName" placeholder="username"/>
      </div>
      <div>
        <label for="loginPassword">Password<span style="color: red;">*</span></label>
        <input type="password" id="loginPassword" placeholder="••••••••" />
      </div>
      <button class="btn-submit" onclick="onLogin()">Login</button>
    </div>
 
    <div class="form" id="form-register">
      <div>
        <label for="registerFirstName">First Name<span style="color: red;">*</span></label>
        <input type="text" id="registerFirstName" placeholder="John" />
      </div>
      <div>
        <label for="registerLastName">Last Name<span style="color: red;">*</span></label>
        <input type="text" id="registerLastName" placeholder="Doe" />
      </div>
      <div>
        <label for="registerUsername">Username<span style="color: red;">*</span></label>
        <input type="text" class="form-control username-placeholder" id="registerUsername" placeholder="username"/>
      </div>
      <div>
        <label for="registerPassword">Password<span style="color: red;">*</span></label>
        <input type="password" id="registerPassword" placeholder="••••••••" />
      </div>
      <button class="btn-submit" onclick="onRegister()">Create Account</button>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>

  <script>
    if (isLoggedIn()) window.location.href = 'contacts.html';
 
    function switchTab(tab) {
      document.getElementById('error-msg').textContent = '';
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
      document.getElementById('form-' + tab).classList.add('active');
      event.target.classList.add('active');
    }
 
    async function onLogin() {
      const username = document.getElementById('loginName').value.trim();
      const password = document.getElementById('loginPassword').value.trim();

      if (!username) {
        document.getElementById('loginName').classList.add('error');
      }
      if (!password) {
        document.getElementById('loginPassword').classList.add('error');
      }

      document.getElementById('loginName').addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById('error-msg').textContent = '';
      });
      document.getElementById('loginPassword').addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById('error-msg').textContent = '';
      });
      
      document.getElementById('error-msg').textContent = '';
 
      try {
        await doLogin();
      } catch (err) {
        document.getElementById('error-msg').textContent = err.message;
      }
    }
 
    async function onRegister() {
      const firstName = document.getElementById('registerFirstName').value.trim();
      const lastName  = document.getElementById('registerLastName').value.trim();
      const username  = document.getElementById('registerUsername').value.trim();
      const password  = document.getElementById('registerPassword').value.trim();

      if (!firstName) {
        document.getElementById('registerFirstName').classList.add('error');
      }
      if (!lastName) {
        document.getElementById('registerLastName').classList.add('error');
      }
      if (!username) {
        document.getElementById('registerUsername').classList.add('error');
      }
      if (!password) {
        document.getElementById('registerPassword').classList.add('error');
      }

      document.getElementById('registerFirstName').addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById('error-msg').textContent = '';
      });
      document.getElementById('registerLastName').addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById('error-msg').textContent = '';
      });
      document.getElementById('registerUsername').addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById('error-msg').textContent = '';
      });
      document.getElementById('registerPassword').addEventListener('input', function() {
        this.classList.remove('error');
        document.getElementById('error-msg').textContent = '';
      }); 

      document.getElementById('error-msg').textContent = '';
 
      try {
        await doRegister();
      } catch (err) {
        document.getElementById('error-msg').textContent = err.message;
      }
    }
  </script>
</body>
</html>
