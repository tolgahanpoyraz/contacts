<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacts App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #064789;
      --surface:  #ffffff;
      --accent:   #FF7D00;
      --text:     #EBF2FA;
      --muted:    #FFECD1;
      --btn:      #2C2A4A;
      --font:     'Georgia', serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 3rem;
      border-bottom: 1px solid #8babf1;
    }

    .logo { font-size: 1.25rem; letter-spacing: 0.05em; }

    nav a {
      color: var(--text);
      text-decoration: none;
      font-size: 0.9rem;
      padding: 0.5rem 1.25rem;
      border: 1px solid #8babf1;
      border-radius: 6px;
      transition: border-color 0.2s;
    }
    nav a:hover { border-color: var(--accent); }

    .hero {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 4rem 2rem;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 6vw, 5rem);
      line-height: 1.1;
      margin-bottom: 1.5rem;
    }

    .hero h1 span { color: var(--accent); }

    .hero p {
      color: var(--muted);
      font-size: 1.1rem;
      max-width: 480px;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }

    .cta-group { display: flex; gap: 1rem; flex-wrap: wrap; justify-content: center; }

    .btn {
      display: inline-block;
      padding: 0.75rem 2rem;
      border-radius: 8px;
      text-decoration: none;
      font-size: 0.95rem;
      font-family: var(--font);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }

    .btn-primary { background: var(--btn); color: #fff; border: 1px solid #8babf1; }
    .btn-outline  { background: transparent; color: var(--text); border: 1px solid #8babf1; }
  </style>
</head>
<body>

  <nav>
    <span class="logo">Contacts</span>
    <a href="login.html">Login</a>
  </nav>

  <main class="hero">
    <h1>Your contacts,<br /> now <span>organized.</span></h1>
    <p>A simple, private place to keep everyone that matters. Add, search, and manage your contacts with ease.</p>
    <div class="cta-group">
      <a href="login.html" class="btn btn-primary">Get Started</a>
      <a href="login.html" class="btn btn-outline">Login</a>
    </div>
  </main>

</body>
</html>
